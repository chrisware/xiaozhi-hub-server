// ---------- 记忆：聊天记录里被截掉的旧对话总结成的"关于用户"的要点，每台设备一份，所有 API 模型共用 ----------
async function renderMemory(root) {
  const d = await api("memory");
  const st = d.settings;
  const SOURCE = () => ({ summary: T("mem_src_summary"), manual: T("mem_src_manual"), cleared: T("mem_src_cleared") });
  const fmt = (t) => (t ? new Date(t * 1000).toLocaleString(LOCALE(), { hour12: false }) : "");
  const edits = {};  // device -> 编辑框里的内容（改过才有）
  page.dirty = () => d.devices.some((x) => edits[x.device] !== undefined && edits[x.device] !== x.memory.summary);
  const status = !st.enabled ? `<span class="pill">${T("mem_chat_off")}</span>`
    : st.summary ? `<span class="pill ok">${T("mem_sum_on")}</span>` : `<span class="pill">${T("mem_sum_off")}</span>`;
  root.innerHTML = `
    <div class="page-head"><div><h1>${T("nav_memory")}</h1><p class="sub">${T("mem_sub", st.max_messages, st.max_tokens)}</p></div>${status}</div>
    <div id="mem-list"></div>`;
  const list = $("mem-list");
  const draw = () => {
    if (!d.devices.length) { list.innerHTML = `<div class="card panel muted">${T("mem_none")}</div>`; return; }
    list.innerHTML = d.devices.map((x) => {
      const m = x.memory, value = edits[x.device] ?? m.summary;
      const models = x.models.map((o) => `${esc(o.label)} ${T("n_msgs", o.count)}${o.agent ? T("mem_no_sum") : ""}`).join(LSEP()) || T("mem_nochat");
      return `<div class="card panel" data-device="${esc(x.device)}">
        <div class="device-top"><span class="dot ${x.online ? "on" : ""}"></span><b class="mono">${esc(x.device)}</b>
          ${m.updated ? `<span class="pill">${esc(SOURCE()[m.source] || "")} · ${esc(fmt(m.updated))}</span>` : `<span class="pill">${T("mem_empty")}</span>`}</div>
        <p class="muted small" style="margin:8px 0 0">${T("mem_stored", models)}</p>
        <label class="f" style="margin-top:14px">${T("mem_full")}<span class="hint">${T("mem_full_hint", st.summary_chars)}</span>
          <textarea class="in" rows="8" data-edit maxlength="5000" placeholder="${T("empty_paren")}">${esc(value)}</textarea></label>
        <div class="actions"><span class="result muted small">${T("n_chars", value.length)}</span>
          <button class="btn" data-clear ${m.summary || value ? "" : "disabled"}>${T("clear")}</button>
          <button class="btn primary" data-save>${T("save")}</button></div></div>`;
    }).join("");
    list.querySelectorAll("[data-device]").forEach((card) => {
      const dev = card.dataset.device, x = d.devices.find((y) => y.device === dev);
      const ta = card.querySelector("[data-edit]");
      ta.oninput = () => { edits[dev] = ta.value; card.querySelector(".result").textContent = T("n_chars", ta.value.length); };
      const save = (btn, text) => busy(btn, async () => {
        const res = await fetch("/admin/api/memory/save", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device: dev, summary: text, version: x.memory.version }) });
        const r = await res.json().catch(() => ({}));
        if (res.status === 401) return toast(T("expired_copy"), true);
        if (res.status === 409) { x.memory = r.memory; toast(r.error, true); draw(); return; }
        if (!res.ok || r.ok === false) return toast(r.error || T("save_failed"), true);
        x.memory = r.memory; delete edits[dev];
        toast(text ? T("mem_saved") : T("mem_cleared")); draw();
      });
      card.querySelector("[data-save]").onclick = (e) => save(e.currentTarget, ta.value);
      card.querySelector("[data-clear]").onclick = (e) => { if (confirm(T("mem_clear_confirm", dev))) save(e.currentTarget, ""); };
    });
  };
  draw();
}

async function renderCallNames(root) {
  const d = await api("call-names");
  let models = d.models.map((m) => ({ ...m, aliases: [...m.aliases] }));
  let learning = d.learning, devices = d.devices;
  const labelOf = (entry) => (d.targets.find((t) => t.entry === entry) || models.find((m) => m.entry === entry) || { label: entry }).label;
  setOnline(devices);
  root.innerHTML = `
    <div class="page-head"><div><h1>${T("nav_calls")}</h1><p class="sub">${T("cn_sub_a", esc(d.reply))}<a href="#how">${T("nav_how")}</a>${T("cn_sub_b")}</p></div>
      <span class="pill ${d.enabled ? "ok" : ""}">${d.enabled ? T("cn_on") : T("cn_off")}</span></div>
    <div class="card panel">
      <label class="switch" style="margin-top:0"><input type="checkbox" id="cn-enabled" ${d.enabled ? "checked" : ""}><span>${T("cn_enable")}</span>
        <small>${T("cn_enable_hint")}</small></label>
      <label class="f" style="margin-top:16px">${T("cn_reply_lbl")}<span class="hint">${T("cn_reply_hint")}</span>
        <input class="in" id="cn-reply" value="${esc(d.reply)}" maxlength="40"></label>
      <p class="muted small" style="margin:12px 0 0">${T("cn_note_a", esc(d.prefixes.join(" / ")))}${T("cn_note_b", esc(labelOf(d.default) || d.default || T("cn_unset")))}</p>
    </div>
    <div id="cn-models"></div>
    <div class="card panel" id="cn-add-box" style="margin-top:16px"></div>
    <div class="actions"><span class="result muted">${T("gb_save_now")}</span><button class="btn primary" id="cn-save">${T("save")}</button></div>`;

  const allAliases = () => models.flatMap((m) => m.aliases);
  const findModel = (entry) => models.find((m) => m.entry === entry);
  const addAlias = (m, a) => {
    a = String(a || "").trim().toLowerCase();
    if (!a) return;
    const owner = models.find((x) => x.aliases.includes(a));
    if (owner && owner !== m) { toast(T("alias_taken", a, owner.label), true); return; }
    if (!m.aliases.includes(a)) m.aliases.push(a);
  };

  const learnHtml = (m) => {
    const mine = learning.target === m.entry;
    const samples = mine ? learning.samples || [] : [];
    const say = esc(m.aliases[0] || m.label);
    let html = "";
    if (mine && learning.active) {
      html = `<div class="banner info" style="margin:12px 0">${T("cn_learning", say, samples.length, learning.count, learning.seconds_left)}</div>
        <button class="btn sm" data-stop>${T("cn_stop")}</button>`;
    } else if (learning.active) {
      html = `<p class="muted small" style="margin:12px 0 0">${T("cn_learning_other")}</p>`;
    } else if (!devices.length) {
      html = `<p class="muted small" style="margin:12px 0 0">${T("cn_no_device_learn")}</p>`;
    } else {
      html = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px">
          ${devices.length > 1 ? `<select class="in" data-device style="max-width:280px">${devices.map((x) => `<option value="${esc(x.session_id)}">${T("cn_option_label", esc(x.device_id || x.session_id), esc(x.ip || ""))}</option>`).join("")}</select>` : ""}
          <button class="btn sm" data-learn>${T("cn_learn_btn")}</button>
          <span class="muted small">${T("cn_learn_hint")}</span></div>`;
    }
    if (samples.length) {
      html += `<div class="section-title" style="margin-top:16px">${T("cn_results")}</div>
        ${samples.map((x, i) => {
          const ok = x.alias && x.alias.length >= 2;
          const dup = allAliases().includes(x.alias);
          return `<label class="switch" style="margin-top:6px"><input type="checkbox" data-sample="${i}" ${ok && !dup ? "checked" : ""} ${ok ? "" : "disabled"}>
            <span>${T("cn_sample", i + 1, esc(x.text), esc(x.alias || T("cn_no_heard")))}</span>${dup ? `<small>${T("cn_dup")}</small>` : ""}</label>`;
        }).join("")}
        <div class="actions" style="justify-content:flex-start"><button class="btn sm" data-take>${T("cn_take")}</button></div>`;
    }
    return html;
  };

  const draw = () => {
    $("cn-models").innerHTML = models.map((m, mi) => `
      <div class="card" data-model="${mi}" style="margin-top:16px">
        <div class="card-head"><h2>${esc(m.label)}</h2><span>
          ${m.entry === d.default ? `<span class="pill">${T("default_model")}</span>` : ""}
          ${m.ready ? "" : `<span class="pill err">${T("cn_not_ready")}</span>`}</span></div>
        <div class="panel" style="padding-top:12px">
          <div class="chips">${m.aliases.length ? m.aliases.map((a, i) => `<span class="chip on">${esc(a)}
            <button class="chip-x" data-del="${i}" title="${T("del")}" aria-label="${T("del_named", esc(a))}">×</button></span>`).join("")
            : `<span class="muted small">${T("cn_no_names")}</span>`}</div>
          <div style="display:flex;gap:8px;margin-top:12px;max-width:440px">
            <input class="in" data-new placeholder="${T("cn_add_ph")}"><button class="btn sm" data-add>${T("add")}</button></div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button class="btn sm" data-remove>${T("cn_remove_model")}</button></div>
          <div data-learnbox>${learnHtml(m)}</div>
        </div>
      </div>`).join("") || `<div class="card panel" style="margin-top:16px"><p class="muted" style="margin:0">${T("cn_none")}</p></div>`;

    $("cn-models").querySelectorAll("[data-model]").forEach((card) => {
      const m = models[+card.dataset.model];
      const q = (sel) => card.querySelector(sel);
      card.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { m.aliases.splice(+b.dataset.del, 1); draw(); }));
      q("[data-add]").onclick = () => { addAlias(m, q("[data-new]").value); draw(); };
      q("[data-new]").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); q("[data-add]").click(); } };
      q("[data-remove]").onclick = () => { models = models.filter((x) => x !== m); draw(); };
      if (q("[data-learn]")) q("[data-learn]").onclick = (e) => busy(e.target, async () => {
        try {
          learning = (await api("call-names/learn", { session_id: q("[data-device]") ? q("[data-device]").value : "", target: m.entry })).learning;
          draw(); poll();
        } catch (err) { toast(err.message, true); }
      });
      if (q("[data-stop]")) q("[data-stop]").onclick = async () => { learning = (await api("call-names/learn/stop", {})).learning; draw(); };
      if (q("[data-take]")) q("[data-take]").onclick = () => {
        card.querySelectorAll("[data-sample]:checked").forEach((c) => addAlias(m, learning.samples[+c.dataset.sample].alias));
        draw(); toast(T("cn_taken"));
      };
    });

    const left = d.targets.filter((t) => !findModel(t.entry));
    $("cn-add-box").innerHTML = left.length
      ? `<div class="section-title" style="margin-top:0">${T("cn_add_title")}</div>
         <div style="display:flex;gap:8px;max-width:440px"><select class="in" id="cn-pick">${left.map((t) => `<option value="${esc(t.entry)}">${esc(t.label)}</option>`).join("")}</select>
         <button class="btn sm" id="cn-add-model">${T("add")}</button></div>
         <p class="muted small" style="margin:8px 0 0">${T("cn_add_note")}</p>`
      : `<p class="muted small" style="margin:0">${T("cn_add_all")}</p>`;
    if ($("cn-add-model")) $("cn-add-model").onclick = () => {
      const t = d.targets.find((x) => x.entry === $("cn-pick").value);
      const m = { entry: t.entry, label: t.label, aliases: [], ready: true };
      models.push(m);
      t.defaults.filter((a) => !allAliases().includes(a)).forEach((a) => addAlias(m, a));  // 已被别的模型占用的跳过
      draw();
    };
  };
  const poll = () => {
    clearInterval(page.timer);
    page.timer = setInterval(async () => {
      try { const r = await api("call-names", undefined, true); learning = r.learning; devices = r.devices; setOnline(devices); } catch (e) { onDevicesError(e); return; }
      draw();
      if (!learning.active) { clearInterval(page.timer); page.timer = null; }
    }, 1500);
  };

  draw();
  if (learning.active) poll();
  const values = () => ({ enabled: $("cn-enabled").checked, reply: $("cn-reply").value.trim(),
    models: models.map((m) => ({ entry: m.entry, aliases: m.aliases })) });
  page.dirty = snapshot(values);
  $("cn-save").onclick = (e) => busy(e.target, async () => {
    try { const r = await api("call-names", values()); toast(r.note); page.dirty = null; await openPage("calls", true); }
    catch (err) { toast(err.message, true); }
  });
}


// ---------- 更新网关 ----------

const fmtTime = (v) => (v ? new Date(typeof v === "number" ? v * 1000 : v).toLocaleString() : "");
// 版本只显示时间和短提交号，不显示提交说明（用户定）
const commitLine = (c) => c && c.short ? `${esc(fmtTime(c.date))} <span class="muted small">${T("commit_short", esc(c.short))}</span>` : `<span class="muted">${T("unknown_val")}</span>`;

async function renderUpdate(root) {
  const d = await api("update");
  if (d.update.state === "running") return renderUpdating(root, d.update);
  const src = d.source || {};
  root.innerHTML = `
    <div class="page-head"><div><h1>${T("nav_update")}</h1><p class="sub">${T("upd_sub")}</p></div>
      ${d.unsupported ? "" : `<button class="btn" id="up-check">${T("upd_check")}</button>`}</div>
    ${d.unsupported ? `<div class="banner warn">${esc(d.unsupported)}</div>` : ""}
    <div class="card panel"><div class="kv two">
      <div class="k">${T("upd_cur")}</div><div>${commitLine(d.current)}</div>
      ${d.running && d.running.short ? `<div class="k">${T("upd_running")}</div><div>${commitLine(d.running)} <span class="pill warn">${T("upd_run_diff")}</span></div>` : ""}
      ${d.branch ? `<div class="k">${T("upd_branch")}</div><div><code>${esc(d.branch)}</code></div>` : ""}
      ${src.url ? `<div class="k">${T("upd_src")}</div><div><code>${esc(src.url)}</code>${T("upd_src_mid", esc(src.branch))}</div>` : ""}
    </div></div>
    <div id="up-last"></div>
    ${d.unsupported ? "" : `<div class="section-title">${T("upd_new_title")}</div><div class="card" id="up-box"></div>`}`;
  renderLastUpdate(d.update);
  if (d.unsupported) return;
  const check = () => busy($("up-check"), async () => {
    $("up-box").innerHTML = `<div class="panel muted">${T("upd_comparing")}</div>`;
    try { drawCheck(root, (await api("update/check", {})).check); }
    catch (e) { $("up-box").innerHTML = `<div class="panel"><div class="banner err" style="margin:0">${esc(e.message)}</div></div>`; }
  });
  $("up-check").onclick = check;
  // 打开这一页时，十分钟内没检查过就自动查一次（只查不更新）
  if (d.check && Date.now() / 1000 - d.check.checked_at < 600) drawCheck(root, d.check);
  else check();
}

function renderLastUpdate(u) {
  const box = $("up-last");
  if (!box || !u || u.state === "idle" || u.state === "running") return;
  const when = fmtTime(u.finished || u.started);
  let html = "";
  if (u.state === "done") {
    html = u.changed
      ? `<div class="banner info">${T("upd_done_ok", esc(when), esc(u.from.short || ""), esc(u.to.short || ""))}</div>`
      : `<div class="banner info">${T("upd_done_latest", esc(when))}</div>`;
    if (u.restart_needed) html += `<div class="banner warn">${T("upd_restart")}</div>`;
  } else {
    html = `<div class="banner ${u.state === "failed" ? "err" : "warn"}">${T("upd_failed_a", esc(when), esc(u.error || ""))}${u.changed ? "" : T("upd_failed_b")}</div>`;
  }
  // 没成功时展开输出：原因（如"按上面的提示处理"）就在里面
  if (u.log && u.log.length) html += `<details class="adv" style="margin:0 0 14px;padding:0;border:0" ${u.state === "done" ? "" : "open"}><summary>${T("upd_output")}</summary><pre class="update-log">${esc(u.log.join("\n"))}</pre></details>`;
  box.style.marginTop = "14px";
  box.innerHTML = html;
}

function drawCheck(root, c) {
  const box = $("up-box");
  if (!box) return;
  const when = c.checked_at ? `<span class="muted small">${T("upd_checked_at", esc(fmtTime(c.checked_at)))}</span>` : "";
  if (c.state === "latest") {
    box.innerHTML = `<div class="card-head"><h2><span class="pill ok">${T("upd_latest")}</span></h2>${when}</div><div class="panel muted">${T("upd_remote_latest")}${commitLine(c.latest)}</div>`;
  } else if (c.state === "available" || c.state === "dirty") {
    box.innerHTML = `<div class="card-head"><h2>${T("upd_avail")}</h2>${when}</div><div class="panel">${T("upd_latest_ver")}${commitLine(c.latest)}</div>
      <div class="panel" style="border-top:1px solid var(--line)">
        ${c.state === "dirty" ? `<div class="banner warn">${esc(c.message)}<br><code>${esc((c.files || []).join("  "))}</code></div>`
          : `<p class="muted small" style="margin:0 0 4px">${T("update_note")}${T("upd_deps")}</p>`}
        <div class="actions" style="margin-top:10px"><button class="btn primary" id="up-start" ${c.state === "dirty" ? "disabled" : ""}>${T("upd_now")}</button></div></div>`;
    if (c.state === "available") $("up-start").onclick = (e) => busy(e.target, async () => {
      if (!confirm(T("upd_confirm_a") + "\n\n" + T("update_note"))) return;
      try { renderUpdating(root, (await api("update/start", {})).update); }
      catch (err) { toast(err.message, true); }
    });
  } else {
    const cls = c.state === "error" ? "err" : "warn";
    box.innerHTML = `<div class="panel"><div class="banner ${cls}" style="margin:0">${esc(c.message)}</div>${when ? `<p style="margin:8px 0 0">${when}</p>` : ""}</div>`;
  }
}

// 更新中：每 2 秒查一次进度。网关重启期间连不上是正常的，等它回来；结束后成功就刷新整页（页面本身也可能更新了）
function renderUpdating(root, u) {
  root.innerHTML = `
    <div class="page-head"><div><h1>${T("nav_update")}</h1><p class="sub">${T("upd_busy_sub")}</p></div></div>
    <div class="card panel">
      <div class="banner info">${T("upd_busy_banner")}</div>
      <p style="margin:0">${T("upd_step")}<b id="up-step">${T("upd_preparing")}</b> <span class="muted small" id="up-elapsed"></span></p>
      <details class="adv"><summary>${T("upd_output")}</summary><pre class="update-log" id="up-log"></pre></details>
    </div>`;
  const started = (u.started || Date.now() / 1000) * 1000;
  let down = false;
  const show = (st) => {
    $("up-step").textContent = down ? T("upd_restarting") : (st && st.step) || T("upd_preparing");
    const sec = Math.round((Date.now() - started) / 1000);
    $("up-elapsed").textContent = T("upd_elapsed", sec) + (sec > 150 ? T("upd_slow_suffix") : "");
    if (st && st.log) $("up-log").textContent = st.log.join("\n");
  };
  show(u);
  clearInterval(page.timer);
  page.timer = setInterval(async () => {
    if (!$("up-step")) return;
    let d;
    try { d = await api("update", undefined, true); down = false; }
    catch (e) { if (isOffline(e)) { down = true; show(null); } return; }
    if (d.update.state === "running") return show(d.update);
    clearInterval(page.timer); page.timer = null;
    if (d.update.state === "done" && d.update.changed && !d.update.restart_needed) {
      toast(T("upd_done_toast", d.update.to.short));
      setTimeout(() => location.reload(), 1500);
    } else {
      await openPage("update", true);
    }
  }, 2000);
}

applyStatic();
route();

</script>
</body>
</html>
