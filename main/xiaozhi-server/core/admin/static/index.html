<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">Xiaozhi Hub Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Crect x='11' y='19' width='42' height='31' rx='10' fill='%23fff'/%3E%3Ccircle cx='24' cy='32' r='5' fill='%234f46e5'/%3E%3Ccircle cx='40' cy='32' r='5' fill='%234f46e5'/%3E%3Cpath d='M27 42h10' stroke='%230891b2' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M32 19v-7' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='10' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --side: #0f172a; --side-text: #94a3b8; --side-hover: #1e293b; --side-line: #1e293b;
    --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --field: #ffffff; --soft: #f8fafc;
    --accent: #4f46e5; --btn: #4f46e5; --btn-hover: #4338ca; --accent-soft: #eef2ff; --accent-line: #c7d2fe;
    --ok: #059669; --ok-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb; --err: #dc2626; --err-soft: #fef2f2;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 3px rgba(15, 23, 42, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --side: #0b1120; --side-hover: #172033; --side-line: #172033;
      --bg: #0f172a; --card: #111a2e; --text: #e2e8f0; --muted: #94a3b8; --line: #23304a; --field: #0b1324; --soft: #0d1629;
      --accent: #818cf8; --btn: #6366f1; --btn-hover: #4f46e5; --accent-soft: #1e2547; --accent-line: #3b437a;
      --ok: #34d399; --ok-soft: #0f2a24; --warn: #fbbf24; --warn-soft: #2a2110; --err: #f87171; --err-soft: #2c1517;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
         color: var(--text); background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .hidden { display: none !important; }

  /* ---------- 布局 ---------- */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  aside { background: var(--side); color: var(--side-text); padding: 20px 14px; position: sticky; top: 0; height: 100vh;
          display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; font-size: 15px; padding: 0 8px 22px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #22d3ee);
  .lang-btn { margin-left: auto; border: 1px solid rgba(255, 255, 255, .28); background: none; color: inherit; border-radius: 6px;
              padding: 1px 8px; font-size: 12px; font-weight: 500; cursor: pointer; opacity: .85; flex: none; }
  .lang-btn:hover { opacity: 1; color: #fff; border-color: rgba(255, 255, 255, .5); }
  .auth .lang-btn { border-color: var(--line); color: var(--muted); }
  .auth .lang-btn:hover { color: var(--text); border-color: var(--accent-line); }

          display: grid; place-items: center; font-size: 16px; flex: none; }
  .nav button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 0;
                background: none; color: inherit; cursor: pointer; text-align: left; margin-bottom: 2px; }
  .nav button:hover { background: var(--side-hover); color: #e2e8f0; }
  .nav button.active { background: var(--side-hover); color: #fff; box-shadow: inset 3px 0 0 #818cf8; }
  .nav .ico { width: 18px; text-align: center; }
  .side-foot { margin-top: auto; font-size: 12px; padding: 12px 10px 0; border-top: 1px solid var(--side-line); }
  .side-foot button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; }
  .side-foot .row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .side-foot a { color: inherit; text-decoration: none; }
  .side-foot a:hover { color: #e2e8f0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #64748b; margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .2); }
  .dot.off { background: #f87171; }
  #online-short { display: none; }
  main { padding: 28px 36px 72px; max-width: 1080px; width: 100%; }

  /* ---------- 通用元素 ---------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px; font-weight: 500; white-space: nowrap;
          background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .03em; margin: 28px 0 10px;
                   display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 12px; }
  .panel { padding: 20px 22px; }
  .choices + .card, .vendors + .card { margin-top: 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 22px;
               border-bottom: 1px solid var(--line); }
  .card-head h2 { font-size: 15px; margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.err { background: var(--err-soft); color: var(--err); }
  .banner.info { background: var(--accent-soft); color: var(--accent); }

  /* 表单 */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 20px; }
  .full { grid-column: 1 / -1; }
  label.f { display: block; font-size: 13px; font-weight: 500; }
  label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .in { width: 100%; margin-top: 6px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
  .in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .seg { display: inline-flex; margin-top: 6px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button { padding: 5px 18px; border-radius: 6px; color: var(--muted); cursor: pointer; border: 0; background: none; }
  .seg button:hover:not(.on) { color: var(--text); }
  .seg button.on { background: var(--btn); color: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; background: var(--card); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  .chip.risky { border-style: dashed; }
  .chip-x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0 0 4px; font-size: 14px; line-height: 1; }
  .chip.risky.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .cli-row { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
  .cli-row:first-child { border-top: 0; padding-top: 0; }
  .cli-k { font-weight: 500; padding-top: 9px; }
  .cli-row .seg { margin-top: 0; flex-wrap: wrap; }
  .cli-row .seg button { padding: 6px 14px; line-height: 1.3; }
  .cli-row .seg button small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .cli-row .seg button.on small { color: rgba(255, 255, 255, .85); }
  #model-custom { margin-top: 8px; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .level { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; background: var(--card); cursor: pointer; }
  .level b { display: block; font-size: 14px; }
  .level small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .level.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .level.auto.on { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .switch { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; cursor: pointer; }
  .switch input { width: 16px; height: 16px; accent-color: var(--accent); }
  .switch small { color: var(--muted); font-size: 12px; }
  details.adv { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.adv[open] summary { margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  .actions .result { margin-right: auto; font-size: 13px; }
  .btn { position: relative; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent-line); }
  .btn.primary { background: var(--btn); border-color: var(--btn); color: #fff; }
  .btn.primary:hover { background: var(--btn-hover); }
  .btn.sm { padding: 4px 12px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.busy { color: transparent !important; opacity: 1; }
  .btn.busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: 14px; height: 14px; border-radius: 50%;
                     border: 2px solid var(--muted); border-right-color: transparent; animation: spin .8s linear infinite; }
  .btn.primary.busy::after { border-color: #fff; border-right-color: transparent; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 选择卡片 */
  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .choices.three { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }  /* 放得下才三列，否则两列 */
  .choice { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: flex; gap: 14px;
            text-align: left; box-shadow: var(--shadow); }
  button.choice { cursor: pointer; }
  .choice.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .choice.off { opacity: .55; cursor: not-allowed; }
  .choice .mark { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; flex: none; font-size: 17px; }
  .choice b { font-size: 15px; } .choice small { display: block; color: var(--muted); word-break: break-all; }
  .vendors { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .vendor { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); cursor: pointer;
            position: relative; text-align: left; box-shadow: var(--shadow); }
  .vendor.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .vendor b { display: block; font-size: 14px; }
  .vendor small { color: var(--muted); font-size: 12px; }
  .vendor i { position: absolute; top: 12px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .vendor i.set { background: var(--ok); }
  .vendor.using { border-color: var(--ok); background: var(--ok-soft); }
  .vendor.using.on { box-shadow: 0 0 0 3px var(--accent-soft), inset 0 0 0 1px var(--ok); border-color: var(--accent); }
  .vendor.using small { display: inline-block; margin-top: 2px; padding: 0 8px; border-radius: 999px; background: var(--ok); color: var(--card); font-weight: 600; }
  .vendor.using i { width: 8px; height: 8px; box-shadow: 0 0 0 3px rgba(5, 150, 105, .18); }

  /* 状态页 */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { padding: 14px 16px; text-align: left; cursor: pointer; }
  .tile:hover { border-color: var(--accent-line); }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-weight: 600; font-size: 15px; margin-top: 2px; word-break: break-all; }
  .tile .d { color: var(--muted); font-size: 12px; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 8px 14px; align-items: center; }
  .kv .k { color: var(--muted); }
  .kv code { word-break: break-all; }
  .rows > div { display: flex; gap: 12px; align-items: center; padding: 10px 22px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .rows > div:first-child { border-top: 0; }
  .rows b { min-width: 7.5em; font-weight: 500; }
  .device { padding: 14px 22px; border-top: 1px solid var(--line); }
  .device:first-child { border-top: 0; }
  .device-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .emogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-top: 12px; }
  .emo { border: 1px solid var(--line); border-radius: 10px; background: var(--soft); padding: 8px 4px; cursor: pointer; text-align: center; }
  .emo:hover { border-color: var(--accent-line); }
  .emo.now { border-color: var(--accent); background: var(--accent-soft); }
  .emo span { display: block; font-size: 22px; line-height: 1.2; }
  .emo small { color: var(--muted); font-size: 11px; }

  /* 音色 */
  .voice-group + .voice-group { margin-top: 18px; }
  .voice-group h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
  .voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .voice { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
           background: var(--card); cursor: pointer; }
  .voice.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .voice .meta { flex: 1; min-width: 0; }
  .voice b { font-size: 14px; } .voice small { display: block; color: var(--muted); font-size: 12px; }
  .play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); cursor: pointer; flex: none; font-size: 12px; }
  .play:hover { border-color: var(--accent); color: var(--accent); }
  .play.playing { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 插件 */
  .plugins { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .plugin { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .plugin.on { border-color: var(--accent-line); background: var(--accent-soft); }
  .plugin.fixed { cursor: default; background: var(--soft); }
  .plugin input { margin-top: 4px; accent-color: var(--accent); }
  .plugin small { display: block; color: var(--muted); font-size: 12px; }
  .disabled-area { opacity: .45; pointer-events: none; }


  /* 工作原理 */
  .flow { display: flex; align-items: stretch; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; }
  .stage { flex: 1 1 0; min-width: 118px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 12px;
           text-align: left; cursor: pointer; box-shadow: var(--shadow); }
  .stage:hover { border-color: var(--accent-line); }
  .stage.static { cursor: default; }
  .stage.static:hover { border-color: var(--line); }
  .stage .ico { font-size: 20px; line-height: 28px; height: 28px; }
  .stage b { display: block; font-size: 14px; }
  .stage .mod { display: block; font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 2px; }
  .stage small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .arrow { align-self: center; color: var(--muted); flex: none; }
  .tips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tip { padding: 14px 16px; }
  .tips .card + .card { margin-top: 0; }
  .tip b { display: block; font-size: 14px; margin-bottom: 6px; }
  .tip .say { font-size: 13px; }
  .tip .say::before { content: var(--say-prefix, "\4F60\FF1A"); color: var(--muted); }
  .tip .res { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .tip .res::before { content: "→ "; color: var(--accent); }
  details.prompt-all > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 14px 22px; }
  details.prompt-all > summary::-webkit-details-marker { display: none; }
  details.prompt-all > summary .toggle { margin-left: auto; color: var(--muted); font-size: 12px; }
  details.prompt-all > .banner { margin: 12px 0 0; }
  .how-foot { margin-top: 28px; color: var(--muted); font-size: 13px; }
  .seg-card + .seg-card { margin-top: 12px; }
  .seg-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px 22px; }
  .seg-head .no { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
                  display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .seg-head b { font-size: 15px; margin-right: 4px; }
  .seg-note { padding: 0 22px 12px; color: var(--muted); font-size: 13px; margin: 0; }
  .prompt-text { margin: 0; padding: 14px 22px 18px; border-top: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
                 font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 520px; overflow: auto; background: var(--soft);
                 border-radius: 0 0 12px 12px; }
  .prompt-text mark { background: var(--warn-soft); color: inherit; border-radius: 4px; padding: 0 2px; box-shadow: inset 0 0 0 1px rgba(180, 83, 9, .25); }
  .prompt-text mark.persona { display: block; background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); padding: 6px 10px; margin: 2px 0; }
  .prompt-text mark i { font-style: normal; font-size: 10.5px; color: var(--warn); margin-right: 4px; font-family: -apple-system, "PingFang SC", sans-serif; }
  .prompt-text mark.persona i { color: var(--accent); }
  details.pseg > summary { list-style: none; cursor: pointer; }
  details.pseg > summary::-webkit-details-marker { display: none; }
  details.pseg > summary .toggle { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* 登录 */
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .auth .card { width: 100%; max-width: 380px; padding: 28px; }
  .auth .brand { color: var(--text); padding: 0 0 18px; }
  .auth h2 { margin: 0 0 4px; font-size: 18px; }

  /* 更新网关 */
  .kv.two { grid-template-columns: max-content minmax(0, 1fr); }
  .update-log { margin: 10px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 8px; max-height: 320px; overflow: auto;
                white-space: pre-wrap; word-break: break-word; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px); padding: 10px 18px; max-width: 90vw;
           border-radius: 10px; background: #0f172a; color: #fff; opacity: 0; transition: opacity .2s, transform .2s;
           pointer-events: none; z-index: 20; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast.err { background: #dc2626; }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { z-index: 10; height: auto; padding: 10px 12px; flex-direction: row; align-items: center; gap: 8px; }
    .brand { padding: 0 6px 0 0; } .brand span { display: none; }
    .nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; }
    .nav button { width: auto; white-space: nowrap; margin: 0; padding: 7px 10px; }
    .nav button.active { box-shadow: inset 0 -2px 0 #818cf8; }
    .nav .ico { display: none; }
    .side-foot { display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; border: 0; white-space: nowrap; flex: none; }
    .side-foot .row { margin: 0; }
    .side-foot #logout, #online-text { display: none; }
    #online-short { display: inline; }
    .side-foot .dot { margin-right: 4px; }

const BOOT_LANG = "__HUB_LANG__";  // Python 在返回页面时替换成 hub 语言；若占位符原样到达浏览器则按 "en"
let lang = (() => {
  let s = null;
  try { s = localStorage.getItem("hubAdminLang"); } catch (e) {}
  if (s === "en" || s === "zh") return s;
  return BOOT_LANG === "zh" ? "zh" : "en";
})();
const T = (k, ...a) => {
  let v = STR[lang][k];
  if (v === undefined) v = STR.en[k];
  if (v === undefined) return k;
  return typeof v === "function" ? v(...a) : v;
};
const LSEP = () => (lang === "zh" ? "\u3001" : ", ");
const LOCALE = () => (lang === "zh" ? "zh-CN" : "en-NZ");
function applyStatic() {
  document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = T(el.dataset.i18nPlaceholder); });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = T(el.dataset.i18nTitle); });
  document.querySelectorAll("[data-i18n-aria-label]").forEach((el) => { el.setAttribute("aria-label", T(el.dataset.i18nAriaLabel)); });
  document.querySelectorAll(".lang-btn").forEach((b) => { b.textContent = T("lang_other"); });
  document.documentElement.style.setProperty("--say-prefix", JSON.stringify(T("say_prefix")));
}

function toast(msg, isError, ms) {
  toast.count = (toast.count || 0) + 1;
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isError ? " err" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.className = isError ? "err" : ""), ms || (isError ? 6000 : 3000));
}

// quiet：后台定时查询用。登录过期时如果页面上有没保存的修改，不跳到登录页（会清掉这些修改），只抛出错误
async function api(path, body, quiet) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  let res;
  try { res = await fetch("/admin/api/" + path, opts); } catch (e) { throw new Error(T("conn_error")); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== "login") {
    if (quiet && page.dirty && page.dirty()) { const e = new Error(EXPIRED()); e.expired = true; throw e; }
    page.dirty = null; await route(); throw new Error(T("expired_relogin"));
  }
  if (!res.ok || data.ok === false) throw new Error(data.error || T("req_failed", res.status));
  return data;
}

// 按钮执行期间显示转圈并禁用，避免重复点击；保存超过半秒（写配置、重建模型要几秒）再提示一句
async function busy(btn, fn) {
  if (btn.disabled) return;
  btn.disabled = true; btn.classList.add("busy");
  const hint = btn.textContent.includes(T("save")) ? T("saving_hint") : "";
  const shown = toast.count;   // the hint never covers the result once it has been shown
  const timer = hint && setTimeout(() => toast.count === shown && toast(hint, false, 60000), 500);
  try { return await fn(); } finally {
    clearTimeout(timer);
    if (hint && $("toast").textContent === hint) $("toast").className = "";   // 结果没另行提示时收起
    btn.disabled = false; btn.classList.remove("busy");
  }
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {  // 局域网 http 页面没有剪贴板权限，退回旧办法
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  toast(T("copied"));
}

// 记录表单初始值，用来判断"有没有改过"
function snapshot(fn) { const first = JSON.stringify(fn()); return () => JSON.stringify(fn()) !== first; }

let authMode = "login";
function authTexts() { $("auth-btn").textContent = authMode === "setup" ? T("setup_enter") : T("login"); }
async function route() {
  let st;
  try { st = await (await fetch("/admin/api/state")).json(); } catch (e) { return; }
  if (st.needs_setup || !st.logged_in) {
    authMode = st.needs_setup ? "setup" : "login";
    clearInterval(page.timer); page.name = "";
    clearInterval(onlineTimer); onlineTimer = null;
    $("app").classList.add("hidden"); $("auth").classList.remove("hidden");

  }

$("auth-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();

  await busy($("auth-btn"), async () => {
    try {
      if (authMode === "setup") {
        if ($("setup-pw").value.length < 6) return fail(T("pw_short"));
        if ($("setup-pw").value !== $("setup-pw2").value) return fail(T("pw_mismatch"));
        await api("setup", { password: $("setup-pw").value });
      } else {
        await api("login", { password: $("login-pw").value });

      }

});

const PAGES = { status: renderStatus, how: renderHow, llm: renderLLM, calls: renderCallNames, grokbot: renderGrokBot, memory: renderMemory, asr: renderASR, tts: renderTTS, intent: renderIntent, update: renderUpdate };
const page = { name: "", dirty: null, timer: null };
function currentPage() { const p = location.hash.slice(1); return PAGES[p] ? p : "status"; }
function confirmLeave() { return !(page.dirty && page.dirty()) || confirm(T("confirm_leave")); }

async function openPage(name, force) {
  if (!force && name === page.name) return;
  if (!force && !confirmLeave()) { history.replaceState(null, "", "#" + page.name); return; }
  clearInterval(page.timer); page.timer = null; page.dirty = null; page.name = name;
  if (audio) { audio.pause(); audio = null; }
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.page === name));
  const root = $("page");
  if (!force) root.innerHTML = `<p class="muted">${T("loading")}</p>`;
  try { await PAGES[name](root); }
  catch (e) { root.innerHTML = `<div class="banner err">${T("load_failed", esc(e.message))}</div>`; }
  if (!force) window.scrollTo(0, 0);
}
document.querySelectorAll("#nav button").forEach((b) => (b.onclick = () => openPage(b.dataset.page)));

// devices 为 null 表示查不到（连不上服务、登录过期）：不能停在上一次的结果上，否则服务停了还显示"1 台设备在线"
let lastOnline = { has: false, devices: null, reason: null };
function setOnline(devices, reason = OFFLINE()) {
  lastOnline = { has: true, devices, reason };
  $("online-dot").classList.toggle("on", !!devices && devices.length > 0);
  $("online-dot").classList.toggle("off", !devices);
  $("online-text").textContent = !devices ? reason : devices.length ? T("devices_online", devices.length) : T("no_devices");
  $("online-short").textContent = !devices ? (reason === OFFLINE() ? T("conn_broken_short") : T("need_login_short")) : devices.length ? T("devices_short", devices.length) : T("no_devices_short");  // 窄屏用
  $("online-dot").parentElement.title = $("online-text").textContent;
}
const OFFLINE = () => T("conn_broken");  // api() 连不上服务时抛出的错误以这几个字开头
const EXPIRED = () => T("expired");
const isOffline = (e) => String(e && e.message).startsWith(OFFLINE());
let expiredWarned = false;
// 后台定时查询出错时：连不上服务、登录过期（页面上有没保存的修改）都要在侧边栏如实显示
function onDevicesError(e) {
  if (isOffline(e)) return setOnline(null);
  if (!e || !e.expired) return;
  setOnline(null, EXPIRED());
  if (!expiredWarned) {
    expiredWarned = true;
    toast(T("expired_unsaved"), true);
  }
}

// 侧边栏的在线设备数不管在哪一页都要跟着变：登录后每 5 秒查一次。
// 页面在后台时跳过；状态页、正在录入称呼的呼名页自己会查，这里也跳过，免得重复请求
let onlineTimer = null;
function watchOnline() {
  const refresh = async () => {
    if (document.hidden || page.name === "status" || (page.name === "calls" && page.timer)) return;
    try { setOnline((await api("devices", undefined, true)).devices); } catch (e) { onDevicesError(e); }
  };
  clearInterval(onlineTimer);
  refresh();
  onlineTimer = setInterval(refresh, 5000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && onlineTimer) watchOnline(); });

// 切换语言：记住选择、换静态文案、重画当前页（服务端下发的字段不跟着换——一个 hub 默认一种语言）
function setLang(l) {
  if (l !== "en" && l !== "zh") return;
  lang = l;
  try { localStorage.setItem("hubAdminLang", l); } catch (e) {}
  applyStatic();
  authTexts();
  if (lastOnline.has) setOnline(lastOnline.devices, lastOnline.reason);
  if (!$("app").classList.contains("hidden") && page.name) openPage(page.name, true);
}

function duration(sec) {
  if (sec < 60) return T("just_now");
  if (sec < 3600) return T("connected_min", Math.floor(sec / 60));
  return T("connected_hm", Math.floor(sec / 3600), Math.floor((sec % 3600) / 60));
}

const openEmotion = new Set();  // 展开了表情测试的设备
let lastDevices = null;  // 最近一次查到的在线设备，状态页据此决定多久再查
// 连不上服务时不能继续显示上一次的列表，否则侧边栏说"连不上服务"，这里还列着设备
function devicesOffline() {
  const box = $("devices");
  if (!box || box.dataset.key === "offline") return;
  box.dataset.key = "offline";
  box.innerHTML = `<div class="panel muted">${T("devices_paused")}</div>`;
}
function renderDevices(dev) {
  lastDevices = dev;
  const box = $("devices");
  if (!box) return;
  if (!dev.devices.length) {
    box.dataset.key = "";
    box.innerHTML = `<div class="panel muted">${T("no_devices_yet")}</div>`;
    return;
  }
  const key = JSON.stringify(dev.devices.map((d) => [d.session_id, d.model_label, d.emotion_test, openEmotion.has(d.session_id)]));  // 设备切了模型也要重绘
  if (box.dataset.key === key) {  // 只更新连接时长，避免重绘打断点击
    box.querySelectorAll("[data-since]").forEach((el) => (el.textContent = duration(dev.now - +el.dataset.since)));
    return;
  }
  box.dataset.key = key;
  box.innerHTML = dev.devices.map((d) => {
    const t = d.emotion_test, open = openEmotion.has(d.session_id), running = t && t.running;
    const progress = !t ? T("emo_idle")
      : running ? T("emo_running", t.index, t.total, t.emoji, esc(t.emotion))
      : t.stopped ? T("emo_stopped", t.index, t.total) : T("emo_done");
    return `<div class="device" data-sid="${esc(d.session_id)}">
      <div class="device-top"><span class="dot on"></span><b class="mono">${esc(d.device_id || T("unknown_device"))}</b>
        ${d.model_label ? `<span class="pill" title="${T("emo_who_title")}">${T("emo_now", esc(d.model_label))}</span>` : ""}
        <span class="muted small">${esc(d.ip || "")}</span><span class="muted small" data-since="${d.connected_at}">${duration(dev.now - d.connected_at)}</span>
        <button class="btn sm" data-act="toggle" style="margin-left:auto">${open ? T("collapse") : T("emo_test")}</button></div>
      ${open ? `<p class="muted small" style="margin:10px 0 0">${progress}</p>
        <div class="emogrid">${dev.emotions.map((e) => `<button class="emo ${running && t.emotion === e.emotion ? "now" : ""}" data-emo="${e.emotion}">
          <span>${e.emoji}</span><small>${esc(e.label)}</small></button>`).join("")}</div>
        <div class="actions" style="justify-content:flex-start">
          <button class="btn sm primary" data-act="all" ${running ? "disabled" : ""}>${T("play_all")}</button>
          <button class="btn sm" data-act="stop" ${running ? "" : "disabled"}>${T("stop")}</button></div>` : ""}
    </div>`;
  }).join("");
  box.querySelectorAll(".device").forEach((el) => {
    const sid = el.dataset.sid, url = `devices/${encodeURIComponent(sid)}/`;
    const act = (name) => el.querySelector(`[data-act="${name}"]`);
    const refresh = async () => { box.dataset.key = ""; renderDevices(await api("devices")); };
    act("toggle").onclick = () => { openEmotion.has(sid) ? openEmotion.delete(sid) : openEmotion.add(sid); refresh(); };
    if (act("all")) act("all").onclick = (e) => busy(e.target, async () => {
      try { await api(url + "emotion-test", {}); await refresh(); } catch (err) { toast(err.message, true); } });
    if (act("stop")) act("stop").onclick = (e) => busy(e.target, async () => {
      try { await api(url + "emotion-test/stop", {}); await refresh(); } catch (err) { toast(err.message, true); } });
    el.querySelectorAll("[data-emo]").forEach((b) => (b.onclick = async () => {
      try { await api(url + "emotion", { emotion: b.dataset.emo }); toast(T("emo_sent", b.querySelector("span").textContent, b.dataset.emo)); await refresh(); }
      catch (err) { toast(err.message, true); }
    }));
  });
}

  const form = $("cli-form");
  const segValue = (k) => { const on = form.querySelector(`.seg[data-k="${k}"] .on`); return on ? on.dataset.v : ""; };
  const cliValues = () => {
    const out = {};
    form.querySelectorAll("input[data-k], select[data-k]").forEach((el) => (out[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value));
    out.model = segValue("model") === "__custom" ? out.model_custom.trim() : segValue("model");

    out.level = (form.querySelector("[data-level].on") || {}).dataset?.level || c.level;
    out.resume_keywords = (out.resume_keywords || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean);

      try {
        const r = await api("llm/claude", cliValues());
        toast(r.changed.length ? r.note : T("nochange"), r.failed); page.dirty = null; await openPage("llm", true);
      } catch (err) { result(`<span style="color:var(--err)">${esc(err.message)}</span>`); }

      try {
        await api("llm/claude", cliValues());
        const r = await api("llm/use", { kind: "cli" });
        toast(r.note, r.failed); page.dirty = null; await openPage("llm", true);
      } catch (err) { result(`<span style="color:var(--err)">${esc(err.message)}</span>`); }
    });

  // ----- API Key -----
  let apiDirty = () => false;
  const renderApi = () => {
    const x = d.vendors.find((y) => y.id === llmVendor), using = d.vendor === x.id;
    const box = $("api-form");
    box.innerHTML = `
      ${using ? "" : `<div class="banner info">${T("api_not_default", esc(x.label))}${active ? T("def_is", esc(active.label)) : ""}${d.callable[x.entry] ? T("api_has_name", esc(d.callable[x.entry][0])) : T("api_no_name")}${T("api_tail")}</div>`}
      ${x.conflict ? `<div class="banner err">${T("conflict_openai", esc(x.entry))}</div>` : ""}
      ${x.hint ? `<div class="banner info">${esc(x.hint)}</div>` : ""}
      <div class="grid2">
        <label class="f">${T("url_lbl")}<input class="in mono" id="api-url" value="${esc(x.base_url)}" placeholder="https://…/v1"></label>
        <label class="f">${T("model_lbl")}${x.models.length ? `<span class="hint">${T("models_hint")}</span>` : ""}
          <input class="in mono" id="api-model" value="${esc(x.model)}" list="api-models" placeholder="${T("model_ph")}">
          <datalist id="api-models">${x.models.map((m) => `<option value="${esc(m)}">`).join("")}</datalist></label>
        <label class="f full">API Key${x.id === "custom" ? `<span class="hint">${T("apikey_hint")}</span>` : ""}
          <input class="in mono" id="api-key" type="password" autocomplete="off"
            placeholder="${x.key_set ? T("key_set", esc(x.key_hint)) : T("key_uns")}"></label>
      </div>
      <p class="muted small" style="margin:8px 0 0">${T("key_note")}</p>
      <div class="actions"><span class="result" id="api-result"></span>
        <button class="btn" id="api-test">${T("test_conn")}</button>
        <button class="btn ${using ? "primary" : ""}" id="api-save">${T("save")}</button>
        ${using ? "" : `<button class="btn primary" id="api-use">${T("save_default")}</button>`}</div>`;
    const values = () => ({ base_url: $("api-url").value.trim(), model: $("api-model").value.trim(), api_key: $("api-key").value.trim() });
    apiDirty = snapshot(values);
    const result = (html) => ($("api-result").innerHTML = html);
    const bad = (msg) => result(`<span style="color:var(--err)">${esc(msg)}</span>`);
    $("api-test").onclick = (e) => busy(e.target, async () => {
      result(`<span class="muted">${T("testing_llm")}</span>`);
      try {
        const r = await api(`llm/vendors/${x.id}/test`, values());
        result(`<span style="color:var(--ok)">${T("test_ok", r.seconds < 1 ? T("under_1s") : T("secs", r.seconds), esc(r.reply))}</span>`);
      }
      catch (err) { bad(err.message); }
    });
    $("api-save").onclick = (e) => busy(e.target, async () => {
      try { const r = await api(`llm/vendors/${x.id}`, values()); toast(r.changed.length ? r.note : T("nochange"), r.failed); page.dirty = null; await openPage("llm", true); }
      catch (err) { bad(err.message); }
    });
    if ($("api-use")) $("api-use").onclick = (e) => busy(e.target, async () => {
      try {
        await api(`llm/vendors/${x.id}`, values());
        const r = await api("llm/use", { kind: "api", vendor: x.id });
        toast(r.note, r.failed); page.dirty = null; await openPage("llm", true);
      } catch (err) { bad(err.message); }
    });

  root.querySelectorAll("[data-vendor]").forEach((b) => (b.onclick = () => {
    if (apiDirty() && !confirm(T("confirm_vendor"))) return;
    llmVendor = b.dataset.vendor;
    root.querySelectorAll("[data-vendor]").forEach((y) => y.classList.toggle("on", y === b));
    renderApi();
  }));
  renderApi();
  page.dirty = () => cliDirty() || apiDirty();
}

let asrView = null;  // 正在查看的识别方式：local / doubao
async function renderASR(root) {
  const d = await api("asr");
  const b = d.doubao, lm = d.local.model;
  if (!asrView) asrView = d.choice === "doubao" ? "doubao" : "local";
  const tag = (using, ok) => using ? `<span class="pill ok">${T("in_use")}</span>` : ok ? `<span class="pill">${T("configured")}</span>` : `<span class="pill">${T("not_set")}</span>`;
  root.innerHTML = `
    <div class="page-head"><div><h1>${T("nav_asr")}</h1><p class="sub">${T("asr_sub")}</p></div>
      <span class="pill ok">${T("current_label", esc(d.selected))}</span></div>
    ${d.choice === "other" ? `<div class="banner warn">${T("other_asr", esc(d.selected))}</div>` : ""}
    ${d.running && d.running !== d.selected ? `<div class="banner warn">${T("asr_running", esc(d.selected), esc(d.running))}</div>` : ""}
    <div class="choices">
      <button class="choice ${asrView === "local" ? "on" : ""}" data-asr="local">
        <div class="mark" style="background:var(--accent-soft);color:var(--accent)">${T("mark_local")}</div>
        <div><b>${T("local_title")}</b> ${tag(d.choice === "local", d.local.exists && lm && lm.ok)}
          <small>${T("local_desc")}</small></div></button>
      <button class="choice ${asrView === "doubao" ? "on" : ""}" data-asr="doubao">
        <div class="mark" style="background:#e0f2fe;color:#0369a1">${T("mark_doubao")}</div>
        <div><b>${T("doubao_title")}</b> ${tag(d.choice === "doubao", b.configured)}
          <small>${T("doubao_desc")}</small></div></button>
    </div>
    <div class="card panel" id="asr-form"></div>
    ${vadCard(d.vad)}
    ${hotwordsCard(d.hotwords)}
    <div class="card" style="margin-top:16px" id="cor-card"></div>
    ${recentCard(d.recent)}
    <p class="muted small" style="margin-top:14px">${T("asr_other")}</p>`;
  let formDirty = () => false;
  const use = (btn, choice, before) => busy(btn, async () => {
    try {
      if (before) await before();
      const r = await api("asr/use", { choice });
      toast(r.note, r.failed); page.dirty = null; await openPage("asr", true);
    } catch (err) { toast(err.message, true); }
  });
  const renderForm = () => {
    const box = $("asr-form");
    if (asrView === "local") {
      const using = d.choice === "local";
      box.innerHTML = !d.local.exists ? `<div class="muted">${T("sherpa_missing")}</div>` : `
        <p style="margin:0 0 14px">${esc(d.local.label)}</p>
        <div class="kv" style="grid-template-columns:max-content minmax(0,1fr)">
          ${using ? d.info.map((i) => `<div class="k">${esc(i.label)}</div><code>${esc(i.value)}</code>`).join("") : ""}
          ${lm ? `<div class="k">${T("model_files")}</div><div style="color:${lm.ok ? "var(--ok)" : "var(--err)"}">${esc(lm.detail)}</div>` : ""}
        </div>
        ${using ? "" : `<div class="actions"><span class="result muted">${T("switch_note")}</span>
          <button class="btn primary" id="local-use" ${lm && lm.ok ? "" : "disabled"}>${T("use_local")}</button></div>`}`;
      formDirty = () => false;
      if ($("local-use")) $("local-use").onclick = (e) => use(e.target, "local");
      return;
    }
    const using = d.choice === "doubao";
    box.innerHTML = `
      ${b.conflict ? `<div class="banner err">${T("conflict_doubao", esc(b.entry))}</div>` : ""}
      <p style="margin:0 0 14px">${T("doubao_intro_a")}<a href="https://console.volcengine.com/speech/service/10038" target="_blank" rel="noopener">${T("volcano_console")}</a>${T("doubao_intro_b")}</p>
      <div class="cli-row"><div class="cli-k">${T("console_ver")}</div><div>
        <div class="seg" id="db-auth"><button type="button" data-v="key" class="${b.auth === "key" ? "on" : ""}">${T("console_new")}</button>
          <button type="button" data-v="app" class="${b.auth === "app" ? "on" : ""}">${T("console_old")}</button></div></div></div>
      <div class="grid2" style="margin-top:6px">
        <label class="f full" data-auth="key">API Key
          <input class="in mono" id="db-key" type="password" autocomplete="off"
            placeholder="${b.key_set ? T("key_set", esc(b.key_hint)) : T("key_uns")}"></label>
        <label class="f" data-auth="app">APP ID<input class="in mono" id="db-appid" value="${esc(b.appid)}" placeholder="${T("digits_ph")}"></label>
        <label class="f" data-auth="app">Access Token
          <input class="in mono" id="db-token" type="password" autocomplete="off"
            placeholder="${b.token_set ? T("key_set", esc(b.token_hint)) : T("key_uns")}"></label>
      </div>
      <div class="cli-row" style="margin-top:6px"><div class="cli-k">${T("billing")}</div><div>
        <div class="seg" id="db-res">${b.resources.map((r) => `<button type="button" data-v="${esc(r.value)}" class="${r.value === b.resource_id ? "on" : ""}">${esc(r.label)}<small>${esc(r.hint)}</small></button>`).join("")}</div>
        <div class="small muted" style="margin-top:6px">${T("billing_note")}</div></div></div>
      <p class="muted small" style="margin:8px 0 0">${T("doubao_secret_note")}</p>
      <div class="actions"><span class="result" id="db-result"></span>
        <button class="btn" id="db-test">${T("test_conn")}</button>
        <button class="btn ${using ? "primary" : ""}" id="db-save">${T("save")}</button>
        ${using ? "" : `<button class="btn primary" id="db-use">${T("save_use")}</button>`}</div>`;
    const seg = (id) => ($(id).querySelector(".on") || {}).dataset?.v || "";
    const syncAuth = () => box.querySelectorAll("[data-auth]").forEach((el) => el.classList.toggle("hidden", el.dataset.auth !== seg("db-auth")));
    box.querySelectorAll(".seg button").forEach((x) => (x.onclick = () => {
      x.parentElement.querySelectorAll("button").forEach((y) => y.classList.toggle("on", y === x));
      syncAuth();
    }));
    syncAuth();
    const values = () => ({ auth: seg("db-auth"), api_key: $("db-key").value.trim(), appid: $("db-appid").value.trim(),
      access_token: $("db-token").value.trim(), resource_id: seg("db-res") });
    formDirty = snapshot(values);
    const result = (html) => ($("db-result").innerHTML = html);
    const bad = (msg) => result(`<span style="color:var(--err)">${esc(msg)}</span>`);
    $("db-test").onclick = (e) => busy(e.target, async () => {
      result(`<span class="muted">${T("db_connecting")}</span>`);
      try {
        const r = await api("asr/doubao/test", values());
        result(`<span style="color:var(--ok)">${T("db_ok", r.seconds < 1 ? T("under_1s") : T("secs", r.seconds))}</span>`);
      } catch (err) { bad(err.message); }
    });
    $("db-save").onclick = (e) => busy(e.target, async () => {
      try { const r = await api("asr/doubao", values()); toast(r.changed.length ? r.note : T("nochange"), r.failed); page.dirty = null; await openPage("asr", true); }
      catch (err) { bad(err.message); }
    });
    if ($("db-use")) $("db-use").onclick = (e) => use(e.target, "doubao", () => api("asr/doubao", values()));
  };
  root.querySelectorAll("[data-asr]").forEach((x) => (x.onclick = () => {
    if (x.dataset.asr === asrView) return;
    if (formDirty() && !confirm(T("confirm_switch_here"))) return;
    asrView = x.dataset.asr;
    root.querySelectorAll("[data-asr]").forEach((y) => y.classList.toggle("on", y === x));
    renderForm();
  }));
  renderForm();
  asrChecks = [() => formDirty(), bindVad(d.vad), bindHotwords(d.hotwords), bindCorrections(d.corrections)];
  page.dirty = () => asrChecks.some((f) => f && f());
  bindRecent(root);
}

// 各卡片分别保存；保存后重新打开本页，显示服务端整理后的结果。own 是这张卡片的“有没有修改”检查
let asrChecks = [];
const saveAndReload = (target, path, body, own) => {
  if (asrChecks.some((f) => f && f !== own && f())
      && !confirm(T("confirm_other_cards"))) return;
  return busy(target, async () => {
    try { const r = await api(path, body); toast(r.note, r.failed); page.dirty = null; await openPage("asr", true); }
    catch (err) { toast(err.message, true); }
  });
};

function bindVad(v) {
  if (!v.supported) return null;
  const input = $("vad-silence");
  const dirty = () => input.value.trim() !== String(v.silence_ms);
  $("vad-save").onclick = (e) => saveAndReload(e.target, "vad", { silence_ms: input.value.trim() }, dirty);
  return dirty;
}

function bindHotwords(h) {
  if (!h.supported) return null;
  const words = [...h.words];
  const draw = () => {
    $("hw-chips").innerHTML = words.map((w, i) => `<span class="chip on">${esc(w)}
        <button class="chip-x" data-del="${i}" title="${T("del")}" aria-label="${T("del_named", esc(w))}">×</button></span>`).join("")
      + h.auto.map((w) => `<span class="chip risky" title="${T("from_calls")}">${esc(w)}</span>`).join("")
      || `<span class="muted small">${T("hw_none")}</span>`;
    $("hw-chips").querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { words.splice(+b.dataset.del, 1); draw(); }));
  };
  const add = () => {
    const input = $("hw-new"), w = input.value.replace(/\s+/g, " ").trim();
    if (!w) return;
    if (/[,，]/.test(w)) { toast(T("hw_comma"), true); return; }
    if (![...words, ...h.auto].some((x) => x.toLowerCase() === w.toLowerCase())) words.push(w);
    input.value = ""; draw();
  };
  $("hw-add").onclick = add;
  $("hw-new").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
  const dirty = () => JSON.stringify(words) !== JSON.stringify(h.words) || !!$("hw-new").value.trim();
  $("hw-save").onclick = (e) => saveAndReload(e.target, "asr/hotwords", { words }, dirty);
  draw();
  return dirty;
}

function bindCorrections(list) {
  const items = list.map((x) => ({ target: x.target, aliases: [...x.aliases] }));
  const original = JSON.stringify(items);
  const card = $("cor-card");
  const draw = () => {
    card.innerHTML = `
      <div class="card-head"><h2>${T("cor_title")}</h2><span class="pill">${T("count_tiao", items.length)}</span></div>
      <div class="panel">
        <p style="margin:0">${T("cor_intro")}</p>
        ${items.map((it, i) => `
          <div class="cor-row" data-row="${i}" style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span class="muted small">${T("fix_to")}</span><input class="in" data-target value="${esc(it.target)}" style="max-width:220px">
              <button class="btn sm" data-del-row title="${T("del_row")}">${T("del")}</button></div>
            <div class="chips">${it.aliases.map((a, j) => `<span class="chip on">${esc(a)}
              <button class="chip-x" data-del="${j}" title="${T("del")}" aria-label="${T("del_named", esc(a))}">×</button></span>`).join("")}</div>
            <div style="display:flex;gap:8px;margin-top:10px;max-width:440px">
              <input class="in" data-new placeholder="${T("cor_new_ph")}"><button class="btn sm" data-add>${T("add")}</button></div>
          </div>`).join("")}
        <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
          <div class="section-title" style="margin-top:0">${T("cor_addsec")}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <input class="in" id="cor-alias" placeholder="${T("cor_alias_ph")}" style="max-width:240px">
            <span class="muted small">${T("fix_to")}</span>
            <input class="in" id="cor-target" placeholder="${T("cor_target_ph")}" style="max-width:240px">
            <button class="btn sm" id="cor-add">${T("add")}</button></div>
        </div>
        <div class="actions"><span class="result muted">${T("save_now")}</span>
          <button class="btn primary" id="cor-save">${T("cor_save")}</button></div>
      </div>`;
    card.querySelectorAll("[data-row]").forEach((row) => {
      const it = items[+row.dataset.row];
      row.querySelector("[data-target]").oninput = (e) => { it.target = e.target.value; };
      row.querySelector("[data-del-row]").onclick = () => { items.splice(+row.dataset.row, 1); draw(); };
      row.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { it.aliases.splice(+b.dataset.del, 1); draw(); }));
      const input = row.querySelector("[data-new]");
      const add = () => { const a = input.value.trim(); if (a && !it.aliases.some((x) => x.toLowerCase() === a.toLowerCase())) it.aliases.push(a); draw(); };
      row.querySelector("[data-add]").onclick = add;
      input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
    });
    $("cor-add").onclick = () => {
      const alias = $("cor-alias").value.trim(), target = $("cor-target").value.trim();
      if (!alias || !target) { toast(T("cor_fill"), true); return; }
      const same = items.find((x) => x.target.toLowerCase() === target.toLowerCase());
      if (same) { if (!same.aliases.some((x) => x.toLowerCase() === alias.toLowerCase())) same.aliases.push(alias); }
      else items.push({ target, aliases: [alias] });
      draw();
    };
    $("cor-save").onclick = (e) => saveAndReload(e.target, "asr/corrections", { items }, dirty);
  };
  const dirty = () => JSON.stringify(items) !== original || !!($("cor-alias").value.trim() || $("cor-target").value.trim());
  draw();
  return dirty;
}

let audio = null;
async function renderTTS(root) {
  const d = await api("tts");
  const isEdge = d.type === "edge";
  let chosen = d.voice;
  const groups = [];
  d.voices.forEach((v) => { let g = groups.find((x) => x.name === v.group); if (!g) groups.push(g = { name: v.group, items: [] }); g.items.push(v); });
  const cur = d.voices.find((v) => v.value === d.voice);
  root.innerHTML = `
    <div class="page-head"><div><h1>${T("nav_tts")}</h1><p class="sub">${T("tts_sub")}</p></div>
      <span class="pill ok">${T("current_label", esc(d.selected))}${cur ? ` · ${esc(cur.name)}` : ""}</span></div>
    ${isEdge ? "" : `<div class="banner warn">${T("tts_only_edge", esc(d.selected))}</div>`}
    <div class="card panel ${isEdge ? "" : "disabled-area"}">
      ${groups.map((g) => `<div class="voice-group"><h3>${esc(g.name)}</h3><div class="voices">${g.items.map((v) => `
        <div class="voice ${v.value === chosen ? "on" : ""}" data-voice="${esc(v.value)}" role="button" tabindex="0">
          <div class="meta"><b>${esc(v.name)}</b> <span class="muted small">${esc(v.gender)}</span><small>${esc(v.style)}</small></div>
          <button class="play" data-play="${esc(v.value)}" title="${T("preview")}">▶</button></div>`).join("")}</div></div>`).join("")}
      <div class="actions"><span class="result muted">${T("tts_save_note")}</span>
        <button class="btn primary" id="tts-save">${T("tts_save")}</button></div>
    </div>`;
  const pick = (el) => { chosen = el.dataset.voice; root.querySelectorAll(".voice").forEach((x) => x.classList.toggle("on", x === el)); };
  root.querySelectorAll(".voice").forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest(".play")) pick(el); };
    el.onkeydown = (e) => { if (e.target === el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(el); } };
  });
  const resetPlay = () => root.querySelectorAll(".play").forEach((x) => { x.classList.remove("playing"); x.textContent = "▶"; });
  root.querySelectorAll(".play").forEach((b) => (b.onclick = () => {
    const wasPlaying = b.classList.contains("playing");
    if (audio) { audio.pause(); audio = null; }
    resetPlay();
    if (wasPlaying) return;
    b.classList.add("playing"); b.textContent = "…";  // 第一次试听要先在线合成，约 1～2 秒
    const a = audio = new Audio("/admin/api/tts/preview?voice=" + encodeURIComponent(b.dataset.play));
    a.onplaying = () => { if (audio === a) b.textContent = "■"; };
    a.onended = resetPlay;
    a.onerror = () => { resetPlay(); toast(T("preview_fail"), true); };
    a.play().catch(() => {});
  }));
  page.dirty = () => chosen !== d.voice;
  $("tts-save").onclick = (e) => busy(e.target, async () => {
    try { const r = await api("tts", { voice: chosen }); toast(r.changed.length ? r.note : T("nochange"), r.failed); page.dirty = null; await openPage("tts", true); }
    catch (err) { toast(err.message, true); }
  });
}

          <div style="flex:1"><b>${esc(p.label)}</b>${p.needs_config ? ` <span class="pill warn">${T("not_setup")}</span>` : ""}<small>${esc(p.desc)}</small></div>
          ${p.settings ? `<button type="button" class="btn sm" data-settings="${esc(p.settings)}" data-label="${esc(p.label)}">${T("plugin_setup_btn")}</button>` : ""}</label>`).join("")}
        ${d.always_on.map((p) => `<div class="plugin fixed"><input type="checkbox" checked disabled>
          <div><b>${esc(p.label)}</b> <span class="pill">${T("always_on")}</span><small>${esc(p.desc)}</small></div></div>`).join("")}
      </div>
      ${d.extra.length ? `<p class="muted small" style="margin:12px 0 0">${T("intent_extra", esc(d.extra.join(LSEP())))}</p>` : ""}

  const values = () => ({ mode, functions: [...root.querySelectorAll("[data-fn]:checked")].map((i) => i.dataset.fn) });
  root.querySelectorAll("[data-settings]").forEach((b) => (b.onclick = (e) => {
    e.preventDefault();   // 按钮在 label 里，不要顺带勾选插件
    const id = b.dataset.settings;
    const onSaved = (ok) => d.plugins.forEach((p) => { if (p.settings === id) p.needs_config = !ok; });
    openPluginSettings(id, b.dataset.label, onSaved).catch((err) => toast(err.message, true));
  }));
  const sync = () => {
    root.querySelectorAll("[data-mode]").forEach((b) => {
      b.classList.toggle("on", b.dataset.mode === mode);
      b.classList.toggle("off", d.locked && b.dataset.mode !== "nointent");
    });
    $("plugins-box").classList.toggle("disabled-area", mode !== "function_call");
    root.querySelectorAll("[data-fn]").forEach((i) => i.closest(".plugin").classList.toggle("on", i.checked));
  };
  root.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => {
    if (d.locked && b.dataset.mode !== "nointent") return toast(T("intent_locked_toast"), true);
    mode = b.dataset.mode; sync();
  }));
  root.querySelectorAll("[data-fn]").forEach((i) => (i.onchange = () => {

    if (i.checked && p && p.needs_config) toast(T("plugin_not_setup", p.label, p.settings ? T("plugin_setup_here") : T("plugin_setup_file")), true);
    sync();
  }));
  sync();
  const intentDirty = snapshot(values);
  pluginSettingsDirty = () => false;
  page.dirty = () => intentDirty() || pluginSettingsDirty();
  $("intent-save").onclick = (e) => busy(e.target, async () => {
    try { const r = await api("intent", values()); toast(r.note, r.failed); page.dirty = null; await openPage("intent", true); }
    catch (err) { toast(err.message, true); }
  });
}

// 插件设置：按接口给的字段列表生成表单，显示在意图识别页插件列表下面
let pluginSettingsDirty = () => false;
async function openPluginSettings(id, label, onSaved) {
  const d = await api("plugin-settings/" + encodeURIComponent(id));
  const box = $("plugin-settings");
  box.classList.remove("hidden");
  const input = (f) => f.type === "secret"
    ? `<input class="in mono" data-k="${esc(f.key)}" type="password" autocomplete="off" placeholder="${f.set ? T("ps_set", esc(f.hint_set)) : T("ps_unset")}">`
    : `<input class="in ${f.type === "number" ? "" : "mono"}" data-k="${esc(f.key)}" ${f.type === "number" ? `type="number" min="${f.min ?? ""}" max="${f.max ?? ""}"` : ""}
        value="${esc(f.value ?? "")}" placeholder="${f.default !== undefined ? T("ps_default", esc(f.default)) : ""}">`;
  box.innerHTML = `
    <div class="section-title" style="margin-top:0">${esc(label)} · ${T("ps_title_suffix")} ${d.configured ? `<span class="pill ok">${T("ps_configured")}</span>` : `<span class="pill warn">${T("ps_not_setup")}</span>`}</div>
    ${d.note ? `<div class="banner info">${esc(d.note)}</div>` : ""}
    ${d.legacy_note ? `<div class="banner warn">${esc(d.legacy_note)}</div>` : ""}
    <div class="grid2">
      ${d.fields.map((f) => `<label class="f ${f.type === "text" ? "full" : ""}">${esc(f.label)}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}${input(f)}</label>`).join("")}
    </div>
    <p class="muted small" style="margin:8px 0 0">${T("ps_secret_note")}</p>
    <div class="actions"><span class="result" id="ps-result"></span>
      <button class="btn" id="ps-close">${T("ps_close")}</button>
      ${d.testable ? `<button class="btn" id="ps-test">${T("ps_test")}</button>` : ""}
      <button class="btn primary" id="ps-save">${T("ps_save")}</button></div>`;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  const values = () => Object.fromEntries([...box.querySelectorAll("[data-k]")].map((i) => [i.dataset.k, i.value.trim()]));
  const dirty = snapshot(values);
  const result = (html) => ($("ps-result").innerHTML = html);
  const bad = (msg) => result(`<span style="color:var(--err)">${esc(msg)}</span>`);
  pluginSettingsDirty = () => !box.classList.contains("hidden") && dirty();
  $("ps-close").onclick = () => { box.classList.add("hidden"); box.innerHTML = ""; };
  if ($("ps-test")) $("ps-test").onclick = (e) => busy(e.target, async () => {
    result(`<span class="muted">${T("ps_testing")}</span>`);
    try {
      const r = await api(`plugin-settings/${encodeURIComponent(id)}/test`, values());
      result(`<span style="color:var(--ok)">✓ ${T("ps_test_ok", r.count, r.seconds, esc(r.first))}</span>`);
    } catch (err) { bad(err.message); }
  });
  $("ps-save").onclick = (e) => busy(e.target, async () => {
    try {
      const r = await api("plugin-settings/" + encodeURIComponent(id), values());
      toast(r.note);
      // 不整页刷新，免得丢掉还没保存的插件勾选；只更新这个插件的"还没配置"标记
      document.querySelectorAll(`[data-settings="${CSS.escape(id)}"]`).forEach((b) => {
        const pill = b.closest(".plugin").querySelector(".pill.warn");
        if (r.configured && pill) pill.remove();
      });
      if (onSaved) onSaved(r.configured);
      await openPluginSettings(id, label, onSaved);
    } catch (err) { bad(err.message); }
  });
}

        ${acc.logged_in ? `<p style="margin:0 0 12px">${days >= 0 ? T("gb_days_left", days, esc(fmt(acc.expires_at))) : T("gb_renew_next")}${T("gb_renew_tail")}</p>`
          : acc.needs_login ? `<p style="margin:0 0 12px">${T("gb_login_invalid")}</p>`

        <div class="actions" style="justify-content:flex-start"><button class="btn primary" id="gb-login">${acc.logged_in ? T("gb_relogin") : T("gb_login")}</button>
          ${acc.logged_in || acc.needs_login ? `<button class="btn" id="gb-logout">${T("logout")}</button>` : ""}</div>`}
    </div>
    <div class="section-title">Bot</div>
    <div class="card panel">
      ${!acc.logged_in ? `<p class="muted" style="margin:0">${T("gb_login_first")}</p>` : `
      ${d.bots_error ? `<div class="banner err">${T("gb_bots_failed", esc(d.bots_error))}</div>` : ""}
      <p class="muted small" style="margin:0 0 4px">${bots ? T("gb_read_at", esc(fmt(d.bots_at))) : T("gb_not_read")}${T("gb_alias_a")}<a href="#calls">${T("nav_calls")}</a>${T("gb_alias_b")}</p>
      ${list.length ? list.map((b) => `<label class="switch" style="margin-top:8px"><input type="checkbox" data-bot="${esc(b.id)}" data-name="${esc(b.name)}" ${checked.has(b.id) ? "checked" : ""}>
          <span>${esc(b.name)}${b.busy ? ` <span class="pill">${T("gb_busy")}</span>` : ""}${checked.has(b.id) ? (aliasesOf(b.id).length ? ` <span class="pill ok">${T("names_label", esc(aliasesOf(b.id).join(LSEP())))}</span>` : ` <span class="pill warn">${T("gb_no_name")}</span>`) : ""}</span>
          <small>${esc(b.preview || "")}</small></label>`).join("") : `<p class="muted" style="margin:8px 0 0">${T("gb_no_bots")}</p>`}
      <div class="actions"><span class="result muted">${T("gb_save_now")}</span>
        <button class="btn" id="gb-refresh">${bots ? T("gb_reload") : T("gb_read_list")}</button><button class="btn primary" id="gb-save">${T("save")}</button></div>`}
    </div>`;
  root.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => copyText(b.dataset.copy)));
  if ($("gb-login")) $("gb-login").onclick = (e) => busy(e.target, async () => {
    try { const r = await api("grokbot/login", {}); window.open(r.url, "_blank", "noopener"); if (stillHere()) await openPage("grokbot", true); }
    catch (err) { toast(err.message, true); }
  });
  if ($("gb-cancel")) $("gb-cancel").onclick = async () => { await api("grokbot/login/cancel", {}); await openPage("grokbot", true); };
  if ($("gb-logout")) $("gb-logout").onclick = async () => {
    if (!confirm(T("gb_logout_confirm"))) return;
    await api("grokbot/logout", {}); await openPage("grokbot", true);
  };
  if ($("gb-refresh")) $("gb-refresh").onclick = (e) => busy(e.target, async () => {
    try { await api("grokbot/bots/refresh", {}); if (stillHere()) await openPage("grokbot", true); } catch (err) { toast(err.message, true); }
  });
  if ($("gb-save")) $("gb-save").onclick = (e) => busy(e.target, async () => {
    const picked = [...root.querySelectorAll("[data-bot]:checked")].map((c) => ({ id: c.dataset.bot, name: c.dataset.name }));
    try { const r = await api("grokbot/bots", { bots: picked }); toast(r.changed.length ? r.note : T("nochange")); await openPage("grokbot", true); }
    catch (err) { toast(err.message, true); }
  });
  if (login.pending) {
    // 等批准期间每 3 秒看一次，登录成功后自动刷新本页
    page.timer = setInterval(async () => {
      if (document.hidden) return;
      try { const s = await api("grokbot", undefined, true); if (!s.login.pending) { clearInterval(page.timer); page.timer = null; await openPage("grokbot", true); } }
      catch (e) { onDevicesError(e); }
    }, 3000);
  }
}
